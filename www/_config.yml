# Jekyll builds the pages under docs/ into the site. The landing page is plain
# HTML and is copied through untouched, which is why there is no theme here.
title: Phoenix
# Quoted, because an unquoted value ends at a colon followed by a space, and
# "writes both down: EBNF" is one: from 2026-09-05 to 2026-09-27 every build
# of the site failed here, before Jekyll read a page.
description: "A compiler generator. A compiler is a grammar plus a sequence of tree walks, and Phoenix writes both down: EBNF, the tree it builds, the passes that walk it. C11, no dependencies."
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
plugins: []
exclude:
  - assemble.sh
