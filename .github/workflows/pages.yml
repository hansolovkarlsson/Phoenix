# The website: www/ is the front page and the look, docs/ is the content.
#
# It is built here rather than committed, so that the site cannot fall behind
# the documentation -- and so that docs/*.md stay plain Markdown, which is how
# they are read on GitHub. www/assemble.sh does the joining and can be run
# locally to see what the build sees.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Every action here runs on Node 24, since 2026-09-27; the versions before
# ran on Node 20, which GitHub deprecated. `ubuntu-latest` is left to move
# to Ubuntu 26 when GitHub moves it, from 2026-10-19: the build is a shell
# script and a Jekyll that runs in its own container, so nothing here asks
# which Ubuntu it is.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site source
        run: ./www/assemble.sh

      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
